      - name: Validate every attachment and reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          forbidden = ['data:image', 'assets/embed', '.svg', '.webp']
          for token in forbidden:
              if token in html:
                  raise SystemExit(f'Forbidden legacy media reference remains: {token}')

          img_refs = re.findall(r'<img[^>]+src="([^"]+)"', html)
          video_refs = re.findall(r'data-video="([^"]+)"', html)
          poster_refs = re.findall(r'data-poster="([^"]+)"', html)
          if len(img_refs) != 10:
              raise SystemExit(f'Expected 10 img refs, got {len(img_refs)}')
          if len(video_refs) != 9 or len(poster_refs) != 9:
              raise SystemExit(f'Expected 9 videos/posters, got {len(video_refs)}/{len(poster_refs)}')

          refs = set(img_refs + video_refs + poster_refs)
          missing=[]
          for ref in refs:
              local = ref[2:] if ref.startswith('./') else ref
              if not Path(local).is_file() or Path(local).stat().st_size == 0:
                  missing.append(local)
          if missing:
              raise SystemExit('Missing referenced files: ' + ', '.join(sorted(missing)))

          print('HTML references OK:', len(img_refs), 'images,', len(video_refs), 'videos')
          PY

          for img in assets/images/*.jpg; do
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$img")
            test -n "$dims" || { echo "Invalid image: $img"; exit 1; }
            echo "OK image $img $dims"
          done

          for video in autumn-capsule.mp4 ai-stylist.mp4 swimsuit.mp4 tonic.mp4 hair-test.mp4 morning-habits.mp4 masheri-green.mp4 masheri-routine.mp4 masheri-demo.mp4; do
            meta=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$video")
            test -n "$meta" || { echo "Invalid video: $video"; exit 1; }
            echo "OK video $video $meta"
          done

