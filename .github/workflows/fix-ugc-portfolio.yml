name: ugc-fix
on:
  push:
    branches:
      - main
jobs:
  fix:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Restore images and covers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<img alt="Юля — UGC-креатор" fetchpriority="high" loading="eager" src="./assets/images/hero-yulia.svg"/>','<img id="hero-img" alt="Юля — UGC-креатор" fetchpriority="high" loading="eager" src="./assets/images/hero-yulia.svg"/>')
          posters={
          'autumn-capsule.mp4':'poster-autumn-capsule','ai-stylist.mp4':'poster-ai-stylist','swimsuit.mp4':'poster-swimsuit','tonic.mp4':'poster-tonic','hair-test.mp4':'poster-hair-test','morning-habits.mp4':'poster-morning-habits','masheri-green.mp4':'poster-masheri-green','masheri-routine.mp4':'poster-masheri-routine','masheri-demo.mp4':'poster-masheri-demo'}
          fallback={'poster-autumn-capsule':'./assets/images/poster-autumn-capsule.svg','poster-ai-stylist':'./assets/images/poster-autumn-capsule.svg','poster-swimsuit':'./assets/images/poster-swimsuit.svg','poster-tonic':'./assets/images/poster-swimsuit.svg','poster-hair-test':'./assets/images/poster-swimsuit.svg','poster-morning-habits':'./assets/images/poster-swimsuit.svg','poster-masheri-green':'./assets/images/poster-masheri-green.webp','poster-masheri-routine':'./assets/images/poster-masheri-routine.webp','poster-masheri-demo':'./assets/images/poster-masheri-demo.webp'}
          for video,pid in posters.items():
              pat=re.compile(r'<video[^>]+src="\./'+re.escape(video)+r'#t=0\.1"></video>')
              s=pat.sub(f'<img id="{pid}" alt="UGC cover" decoding="async" loading="lazy" src="{fallback[pid]}"/>',s)
          loaders='''<script src="./assets/embed/hero-yulia.js?v=8"></script>\n<script src="./assets/embed/poster-autumn-capsule.js?v=8"></script>\n<script src="./assets/embed/poster-ai-stylist.js?v=8"></script>\n<script src="./assets/embed/poster-swimsuit.js?v=8"></script>\n<script src="./assets/embed/poster-tonic.js?v=8"></script>\n<script src="./assets/embed/group-beauty.js?v=8"></script>\n'''
          if 'hero-yulia.js?v=8' not in s:
              s=s.replace('<script>\nconst filters',loaders+'<script>\nconst filters')
          s=s.replace('<!-- UGC portfolio v4-flat -->','<!-- UGC portfolio v8 -->')
          p.write_text(s,encoding='utf-8')
          missing=[x for x in ['hero-img']+list(posters.values()) if f'id="{x}"' not in s]
          if missing: raise SystemExit('Missing image ids: '+str(missing))
          PY
      - name: Improve videos
        run: |
          for f in autumn-capsule.mp4 ai-stylist.mp4 swimsuit.mp4 tonic.mp4 hair-test.mp4 morning-habits.mp4 masheri-green.mp4 masheri-routine.mp4 masheri-demo.mp4; do
            w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")
            if [ "$w" -lt 700 ]; then
              ffmpeg -y -hide_banner -loglevel error -i "$f" -vf "scale=720:1280:flags=lanczos,unsharp=5:5:0.45:5:5:0" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 128k "$f.new.mp4"
              mv "$f.new.mp4" "$f"
            fi
          done
      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.mp4
          git commit -m "Fix hero, covers and video quality"
          git push origin gh-pages
