name: Publish UGC portfolio to GitHub Pages

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Copy portfolio from the last good Netlify deploy
        env:
          SOURCE_SITE: https://6aa8220a31be0638ce73408a--yulia-ugc.netlify.app
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p assets/images

          curl -fL --retry 3 --retry-delay 2 "$SOURCE_SITE/" -o index.html

          images=(
            hero-yulia.jpg
            poster-autumn-capsule.jpg
            poster-ai-stylist.jpg
            poster-swimsuit.jpg
            poster-tonic.jpg
            poster-hair-test.jpg
            poster-morning-habits.jpg
            poster-masheri-green.jpg
            poster-masheri-routine.jpg
            poster-masheri-demo.jpg
          )

          for file in "${images[@]}"; do
            echo "Downloading image $file"
            curl -fL --retry 3 --retry-delay 2 "$SOURCE_SITE/assets/images/$file" -o "assets/images/$file"
            test -s "assets/images/$file"
          done

          videos=(
            autumn-capsule.mp4
            ai-stylist.mp4
            swimsuit.mp4
            tonic.mp4
            hair-test.mp4
            morning-habits.mp4
            masheri-green.mp4
            masheri-routine.mp4
            masheri-demo.mp4
          )

          for file in "${videos[@]}"; do
            echo "Downloading video $file"
            curl -fL --retry 3 --retry-delay 2 "$SOURCE_SITE/$file" -o "$file"
            test -s "$file"
          done

          touch .nojekyll

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          html = Path('index.html').read_text(encoding='utf-8')
          missing = []
          for path in re.findall(r'(?:src|data-poster|data-video)="([^"]+)"', html):
              if path.startswith(('http://', 'https://', 'mailto:', '#')):
                  continue
              local = path[2:] if path.startswith('./') else path
              if not (root / local).exists():
                  missing.append(local)
          if missing:
              raise SystemExit(f'Missing site files: {sorted(set(missing))}')

          videos = list(root.glob('*.mp4'))
          images = list((root / 'assets/images').glob('*.jpg'))
          if len(videos) != 9 or len(images) != 10:
              raise SystemExit(f'Expected 9 videos and 10 images, got {len(videos)} videos and {len(images)} images')
          print(f'Validated site: {len(videos)} videos, {len(images)} images, index.html OK')
          PY

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish UGC portfolio"
            git push origin gh-pages
          fi
