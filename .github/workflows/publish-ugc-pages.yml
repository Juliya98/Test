name: Publish UGC videos to GitHub Pages

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Download portfolio videos from the last live Netlify deploy
        env:
          SOURCE_SITE: https://6aa8220a31be0638ce73408a--yulia-ugc.netlify.app
        run: |
          set -euo pipefail
          videos=(
            autumn-capsule.mp4
            ai-stylist.mp4
            swimsuit.mp4
            tonic.mp4
            hair-test.mp4
            morning-habits.mp4
            masheri-green.mp4
            masheri-routine.mp4
            masheri-demo.mp4
          )

          for file in "${videos[@]}"; do
            echo "Downloading $file"
            curl -fL --retry 3 --retry-delay 2 "$SOURCE_SITE/$file" -o "$file"
            test -s "$file"
          done

          test -s index.html
          test -s assets/images/hero-yulia.svg
          touch .nojekyll

      - name: Commit videos to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish UGC portfolio videos"
            git push origin gh-pages
          fi
