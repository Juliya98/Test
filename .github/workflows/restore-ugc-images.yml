name: Restore UGC images and covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ugc-images.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Restore the portfolio HTML with original embedded images
        env:
          SOURCE_SITE: https://6aa8220a31be0638ce73408a--yulia-ugc.netlify.app
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_SITE/" -o /tmp/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/index.html').read_text(encoding='utf-8')
          image_count = html.count('data:image/jpeg;base64,') + html.count('data:image/png;base64,') + html.count('data:image/webp;base64,')
          videos = set(re.findall(r'(?:data-video|src)="(?:\./)?([^"#]+\.mp4)', html, re.I))
          expected = {
              'autumn-capsule.mp4','ai-stylist.mp4','swimsuit.mp4','tonic.mp4','hair-test.mp4',
              'morning-habits.mp4','masheri-green.mp4','masheri-routine.mp4','masheri-demo.mp4'
          }
          missing = sorted(expected - videos)
          if image_count < 10:
              raise SystemExit(f'Expected at least 10 embedded images, found {image_count}')
          if missing:
              raise SystemExit(f'Missing video references in HTML: {missing}')
          # Bust browser cache after this repair.
          html = html.replace('<!-- UGC portfolio v4-flat -->', '<!-- UGC portfolio v5-images-restored -->')
          Path('index.html').write_text(html, encoding='utf-8')
          print(f'Validated: {image_count} embedded images and all 9 video references')
          PY
          touch .nojekyll

      - name: Publish repaired page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore portfolio photo and custom covers"
            git push origin gh-pages
          fi
