name: Install portfolio covers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-portfolio-covers.yml"

permissions:
  contents: write

jobs:
  install-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download optimized covers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/covers
          urls=(
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/16d0bc220779e4d9fb8e54b76949619c063792256345142810291a24662530dd.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/f7500e72c7ebcd02af008035f07b0fca7165b1f468ddd2e5fd048657eb028a12.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/88dd11cf913f177643f3662ed11a48cf0c75bf776c84c10e160be7946bd48630.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/e8195ee9fba28025268725c9e5a37591ad0c2a3cc83de493e580ff5edbf8b271.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/3eaed62802734e3df03d5e4c4de71cb3a1b0327705dbda333c2ee1dff168a6bf.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/db30aeddc7f12162f1c296fd42c711ffa1855b55c192a88f245bb4bf9580c06b.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/77be1178a2fe0b7eeab6f3def03d9a4a1ee0ef01275d47f0fecc9dee6be575c7.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/d904f6822d362e24f3b0e62b318162cb89045d9723d479b9fc281a00e3e87101.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/b421d335d746ae498d7229c0ef36d29beebe277db54af790536ce485f06d740c.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/a45d7c06debba628de866e8baa8630062426113840098c6b57a3b827b520c739.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/fb25be7f2121d9709c42a0d4504fbff663e2017a09ae4616e290666c0fa35a19.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/4817a65bc1d8b96274032c5050c17de9ff95990083054556d53fe0298900c74b.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/ddd93c334137fc32f8e73002317827b82b7e761b1f3e35f43a903d98c6cd461d.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/ea9085da1c44240a7d1d463220f679b5cc0ab61794e7171ffc2d373cb735a9a5.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/0888bdc15dc05b1885a977a412eed8d3be381f8531b6d4f58be8653424d3edc1.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/df9ee13a404c5fd7dc8cc8da75312c9bc249d3d48380da071191d0c0b6b08b39.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/5ab8a5f1cdb9f4477ab7afb8b367389aafc5f06d6b60d469a80ea75ed84e2d86.webp"
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/fd72f6b015e27d0380fb159993c3e41456755c5bf78340c749cb93e63bdcf288.webp"
          )
          for i in $(seq 1 18); do
            printf -v nn "%02d" "$i"
            tmp="assets/images/covers/work-${nn}.webp.tmp"
            dest="assets/images/covers/work-${nn}.webp"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "${urls[$((i-1))]}" --output "$tmp"
            python3 - "$tmp" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
b = p.read_bytes()
if len(b) < 50000:
    raise SystemExit(f"Downloaded image is unexpectedly small: {len(b)} bytes")
if b[:4] != b"RIFF" or b[8:12] != b"WEBP":
    raise SystemExit("Downloaded file is not a valid WebP container")
PY
            mv "$tmp" "$dest"
          done
          rm -f assets/images/covers/work-*.png

      - name: Point portfolio cards to local covers
        shell: bash
        run: |
          python3 - <<'PY'
from pathlib import Path
import re

path = Path("index.html")
html = path.read_text(encoding="utf-8")

for n in range(1, 19):
    pattern = re.compile(r'<img class="work-preview"[^>]*alt="Обложка ролика %d"[^>]*>' % n)
    m = pattern.search(html)
    if not m:
        raise SystemExit(f"Cover img tag not found for work {n}")
    tag = m.group(0)
    src = f'./assets/images/covers/work-{n:02d}.webp'
    tag = re.sub(r'\ssrc="[^"]+"', f' src="{src}"', tag, count=1)
    tag = re.sub(r'\sdata-custom-src="[^"]+"', '', tag)
    tag = re.sub(r'\swidth="[^"]+"', ' width="480"', tag)
    tag = re.sub(r'\sheight="[^"]+"', ' height="853"', tag)
    if n <= 3:
        tag = re.sub(r'\sloading="[^"]+"', ' loading="eager"', tag)
        tag = re.sub(r'\sfetchpriority="[^"]+"', ' fetchpriority="high"', tag)
    else:
        tag = re.sub(r'\sloading="[^"]+"', ' loading="lazy"', tag)
        tag = re.sub(r'\sfetchpriority="[^"]+"', ' fetchpriority="low"', tag)
    html = html[:m.start()] + tag + html[m.end():]

path.write_text(html, encoding="utf-8")
PY

      - name: Commit covers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images/covers index.html
          git commit -m "Replace portfolio covers with optimized WebP images"
          git push origin HEAD:main
