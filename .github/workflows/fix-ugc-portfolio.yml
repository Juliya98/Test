name: ugc-fix
on:
  push:
    branches:
      - main
jobs:
  fix:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Embed all portfolio images directly into HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          expected = {
              'hero-img',
              'poster-autumn-capsule',
              'poster-ai-stylist',
              'poster-swimsuit',
              'poster-tonic',
              'poster-hair-test',
              'poster-morning-habits',
              'poster-masheri-green',
              'poster-masheri-routine',
              'poster-masheri-demo',
          }

          image_map = {}
          for js in Path('assets/embed').glob('*.js'):
              text = js.read_text(encoding='utf-8')
              for element_id, data_uri in re.findall(
                  r"document\.getElementById\('([^']+)'\)\.src='(data:image/[^']+)'",
                  text,
              ):
                  image_map[element_id] = data_uri

          missing_sources = sorted(expected - image_map.keys())
          if missing_sources:
              raise SystemExit('Missing embedded image sources: ' + ', '.join(missing_sources))

          for element_id in sorted(expected):
              pattern = re.compile(
                  r'(<img\b(?=[^>]*\bid="' + re.escape(element_id) + r'")[^>]*\bsrc=")[^"]*(")'
              )
              s, count = pattern.subn(
                  lambda m, uri=image_map[element_id]: m.group(1) + uri + m.group(2),
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not replace image src for {element_id}; count={count}')

          # Remove JS image loaders: the images are now part of the HTML itself.
          s = re.sub(
              r'^<script src="\./assets/embed/[^\"]+\.js\?v=\d+"></script>\n?',
              '',
              s,
              flags=re.MULTILINE,
          )

          # Keep videos hosted by GitHub Pages itself.
          videos = [
              'autumn-capsule.mp4', 'ai-stylist.mp4', 'swimsuit.mp4',
              'tonic.mp4', 'hair-test.mp4', 'morning-habits.mp4',
              'masheri-green.mp4', 'masheri-routine.mp4', 'masheri-demo.mp4',
          ]
          for video in videos:
              if not Path(video).is_file():
                  raise SystemExit('Missing video on gh-pages: ' + video)
              if f'data-video="./{video}"' not in s:
                  raise SystemExit('index.html does not reference local video: ' + video)

          s = re.sub(r'<!-- UGC portfolio[^>]*-->', '<!-- UGC portfolio v10-direct-images -->', s, count=1)

          if s.count('data:image/') < 10:
              raise SystemExit('Expected at least 10 directly embedded images in index.html')
          if 'assets/embed/' in s:
              raise SystemExit('Image loader scripts still remain in index.html')

          p.write_text(s, encoding='utf-8')
          print('OK: embedded', len(expected), 'images directly into index.html')
          PY

      - name: Commit fixed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Embed portfolio images directly in page"
            git push origin gh-pages
          fi
